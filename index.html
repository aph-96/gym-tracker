<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gym Tracker</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Pick Today’s Workout</h1>
    <div class="buttons">
      <button data-day="push">Push</button>
      <button data-day="pull">Pull</button>
      <button data-day="legs">Legs</button>
      <button data-day="upper">Upper</button>
    </div>

    <script>
      document.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          localStorage.setItem("gymTracker.today", btn.dataset.day);
          window.location.href = `${btn.dataset.day}.html`;
        });
      });
    </script>
  </body>
</html>
