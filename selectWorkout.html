<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Workout</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/workoutTypes.js"></script>
  </head>
  <body>
    <h1>Select Workout Type</h1>
    <section id="workoutButtons"></section>

    <script>
      const container = document.getElementById("workoutButtons");
      Object.entries(WORKOUT_TYPES).forEach(([key, val]) => {
        const btn = document.createElement("button");
        btn.textContent = val.label;
        btn.style.backgroundColor = val.color;
        btn.onclick = () => {
          localStorage.setItem("selectedWorkoutType", key);
          window.location.href = "workout.html";
        };
        container.appendChild(btn);
      });
    </script>
  </body>
</html>
